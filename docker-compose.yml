services:
  postgres:
    image: postgres:16-alpine
    container_name: kestrel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
      POSTGRES_DB: kestrel
    ports:
      - "5432:5432"
    volumes:
      - kestrel_pgdata:/var/lib/postgresql/data

volumes:
  kestrel_pgdata:
